apiVersion: v1
kind: ServiceAccount
metadata:
  name: serving
  namespace: causal-set-emergence
  labels:
    app.kubernetes.io/name: causal-set-emergence
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: causal-set-emergence
  labels:
    app.kubernetes.io/name: causal-set-emergence
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: causal-set-emergence
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: causal-set-emergence
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: serving
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        q5m.ai/production: 'true'
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: ghcr.io/q5m-ai/causal-set-emergence:q5m-release
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        ports:
        - containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
            ephemeral-storage: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
            ephemeral-storage: 96Mi
        startupProbe:
          httpGet: {path: /startupz, port: 8080}
          periodSeconds: 2
          timeoutSeconds: 1
          failureThreshold: 30
        readinessProbe:
          httpGet: {path: /readyz, port: 8080}
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 2
        livenessProbe:
          httpGet: {path: /livez, port: 8080}
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: causal-set-emergence
  labels:
    app.kubernetes.io/name: causal-set-emergence
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: causal-set-emergence
    app.kubernetes.io/component: web
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: causal-set-emergence
  labels:
    app.kubernetes.io/name: causal-set-emergence
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: causal-set-emergence
      app.kubernetes.io/component: web
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: causal-set-emergence
  labels:
    app.kubernetes.io/name: causal-set-emergence
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-ingress
  namespace: causal-set-emergence
  labels:
    app.kubernetes.io/name: causal-set-emergence
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: causal-set-emergence
      app.kubernetes.io/component: web
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: causal-set-emergence
  labels:
    app.kubernetes.io/name: causal-set-emergence
spec:
  ingressClassName: traefik
  rules:
  - host: causal-set-emergence.q5m.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80
