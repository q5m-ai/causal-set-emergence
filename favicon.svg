<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Paseo black hole</title>
  <desc id="desc">A compact, stylized rendering of the first M87 black-hole image.</desc>
  <defs>
    <radialGradient id="space" cx="50%" cy="46%" r="72%">
      <stop offset="0" stop-color="#160706"/>
      <stop offset=".66" stop-color="#070506"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="58%" r="53%">
      <stop offset="29%" stop-color="#000"/>
      <stop offset="42%" stop-color="#160000"/>
      <stop offset="53%" stop-color="#8c1707"/>
      <stop offset="64%" stop-color="#ff5b0a"/>
      <stop offset="73%" stop-color="#ffb229" stop-opacity=".95"/>
      <stop offset="82%" stop-color="#f04a08" stop-opacity=".48"/>
      <stop offset="100%" stop-color="#6c0900" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="halo" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="url(#space)"/>

    <!-- Diffuse, asymmetric M87* emission halo. -->
    <ellipse cx="32" cy="34" rx="28" ry="23" fill="#9d1906" opacity=".28" filter="url(#halo)"/>
    <ellipse cx="32" cy="33" rx="27" ry="23" fill="url(#glow)" filter="url(#soft)"/>

    <!-- Event-horizon shadow. -->
    <ellipse cx="32" cy="32" rx="13.2" ry="11.5" fill="#010102"/>
    <ellipse cx="32" cy="30.5" rx="9.8" ry="8.2" fill="#000"/>
  </g>
</svg>
